<!DOCTYPE html>
<html lang="de">
    <head>
        <title>Startpage</title>
        <meta charset="utf-8" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        
        <link id="favicon" rel="icon" href="gfx/favicon.png">
        <link rel="stylesheet" href="style.css">
        
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    </head>
    <body onload="pageLoaded();">
        <div id="page2"></div>
        <div id="page1">
            <div id="tab-identity">
                <img id="tab-icon-button" src="gfx/favicon.png" alt="" title="Tab icon" />
                <span id="tab-color-button" title="Tab icon color"><span id="tab-color-icon"></span></span>
                <input id="tab-title-input" type="text" title="Tab title" />
                <div id="tab-icon-picker" class="tab-dropdown" hidden></div>
                <div id="tab-color-picker" class="tab-dropdown" hidden>
                    <div id="color-sv"><div id="color-sv-cursor"></div></div>
                    <div id="color-hue"><div id="color-hue-cursor"></div></div>
                    <div id="color-swatches"></div>
                    <input id="color-hex" type="text" maxlength="7" spellcheck="false" />
                </div>
            </div>
            <img id="settings-button" src="gfx/gear.svg" alt="" title="Settings" />
            <!-- CENTER --><table width="100%" height="100%" cellspacing="0" cellpadding="0" border="0"><tr><td valign="middle" align="center">
            
                <table cellspacing="0" cellpadding="0" border="0">
                    <tr>
                    	<td class="cmd-td" height="80">
                            <input id="cmd-input" class="cmd" type="text" placeholder="command ..." />
                        </td>
                        <td width="100" rowspan="3"></td>
                    	<td class="cmd-td" colspan="2" height="80">
                            <input id="search-input" class="cmd" type="text" placeholder="search ..." />
                        </td>
                    </tr>
                    <tr>
                        <td class="large-content-cell">
                            <span id="clock">--:--</span><br />
                            <span id="greeting">..., ...</span>
                        </td>
                        <td class="large-content-cell" colspan="2">
                            <table class="weather-table">
                                <tr>
                                    <td rowspan="2">
                                        <img src="gfx/empty.gif" alt="" title="" id="main-weather-img" />
                                    </td>
                                    <td>
                                        <span id="date">... -</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td>
                                        <span id="current-weather">...</span>
                                    </td>
                                </tr>
                            </table>
                            <table cellspacing="0" cellpadding="0" border="0">
                                <tr id="small-weather-row"></tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td valign="top" align="center">
                            <div id="favorits-container" class="favs"></div>
                        </td>
                        <td valign="top" align="center">
                            <div id="tools-container" class="tool-list">
                                <img src="gfx/tools.png" alt="Tools:" title="">
                            </div>
                        </td>
                        <td valign="top" align="center">
                            <div id="books-container" class="tool-list">
                                <img src="gfx/book.png" alt="Tools:" title="">
                            </div>
                        </td>
                    </tr>
                    <tr>
                    	<td colspan="4" height="50"></td>
                    </tr>
                </table>
						
            <!-- /CENTER --></td></tr></table>
        </div>
        <div id="error-overlay" hidden>
            <div id="error-box">
                <div id="error-title"></div>
                <pre id="error-text"></pre>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
